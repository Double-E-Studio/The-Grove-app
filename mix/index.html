<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Grove Mix Link</title>
  <style>
    :root {
      --bg: #11131a;
      --card: #1b1f2b;
      --text: #e7ecff;
      --muted: #a9b3d6;
      --accent: #6bc47a;
      --accent-2: #4e9ef7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #1b2338 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: min(700px, 100%);
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    h1 { margin: 0 0 20px; font-size: 1.5rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
      color: white;
      background: var(--accent-2);
      transition: opacity 0.2s;
    }
    button:hover:not(:disabled) { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.success { background: var(--accent); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Open shared mix in The Grove</h1>
    <div class="actions">
      <button id="openAppButton" type="button">Open in The Grove</button>
      <button id="downloadAndroidButton" class="success" type="button">Download for Android</button>
      <button id="downloadIOSButton" class="success" type="button">Download for iOS</button>
    </div>
    <p id="downloadHint" style="display:none; margin-top:16px; color:var(--muted); font-size:0.9rem;">
      App not found — download it with the buttons above.
    </p>
  </main>

  <script>
    (function () {
      function getEncodedPayload() {
        const hash = (window.location.hash || '').replace(/^#/, '').trim();
        const query = new URLSearchParams(window.location.search);
        const candidate = (query.get('code') || '').trim() || hash;
        if (!candidate) return null;
        const versioned = /^v(\d+):([A-Za-z0-9_+/=\-]+)$/.exec(candidate);
        if (versioned) return { version: versioned[1], encoded: versioned[2] };
        if (/^[A-Za-z0-9_+/=\-]+$/.test(candidate)) return { version: '1', encoded: candidate };
        return null;
      }

      const payload = getEncodedPayload();
      const openAppButton = document.getElementById('openAppButton');
      const downloadAndroidButton = document.getElementById('downloadAndroidButton');
      const downloadIOSButton = document.getElementById('downloadIOSButton');
      const hint = document.getElementById('downloadHint');

      function showDownloadHint() {
        hint.style.display = 'block';
      }

      if (!payload) {
        openAppButton.disabled = true;
      } else {
        const appLink = `thegrove://mix/v${payload.version}/${payload.encoded}`;

        openAppButton.addEventListener('click', function () {
          window.location.href = appLink;

          let appOpened = false;

          function onHide() {
            appOpened = true;
            cleanup();
          }

          function cleanup() {
            document.removeEventListener('visibilitychange', onVisibilityChange);
            window.removeEventListener('blur', onHide);
            clearTimeout(timer);
          }

          function onVisibilityChange() {
            if (document.visibilityState === 'hidden') onHide();
          }

          document.addEventListener('visibilitychange', onVisibilityChange);
          window.addEventListener('blur', onHide);

          const timer = setTimeout(function () {
            cleanup();
            if (!appOpened) showDownloadHint();
          }, 500);
        });

        window.location.href = appLink;
      }

      downloadAndroidButton.addEventListener('click', function () {
        window.location.href = 'https://play.google.com/store/apps/details?id=com.thegrove.sleepsound';
      });

      downloadIOSButton.addEventListener('click', function () {
        window.location.href = 'https://apps.apple.com/app/id6754394085';
      });
    })();
  </script>
</body>
</html>
